appId: io.github.lowsidelabs.trove
productName: Trove
directories:
  output: out/release
files:
  - dist/**
  - package.json
  - node_modules/**
  - "!src/**"
  - "!build/**"
  - "!out/**"
  - "!.turbo/**"
  - "!scripts/**"
  - "!*.log"
  - "!*.md"
  - "!tsconfig.json"
  - "!electron.vite.config.ts"
asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: false
mac:
  identity: "-"
  category: public.app-category.productivity
  icon: out/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
